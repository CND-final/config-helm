apiVersion: v1
kind: Service
metadata:
  name: {{ include "config-man.fullname" . }}-frontend
  labels:
    {{- include "config-man.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  type: {{ .Values.frontend.service.type }}
  selector:
    {{- include "config-man.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
  ports:
    - name: http
      port: {{ .Values.frontend.port }}
      targetPort: {{ .Values.frontend.port }}
      protocol: TCP
      nodePort: {{ .Values.frontend.service.nodePort }}
