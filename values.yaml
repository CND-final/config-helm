nameOverride: ""
fullnameOverride: ""

backend:
  image: ghcr.io/cnd-final/config-man-backend
  tag: latest
  replicas: 3
  port: 3000
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
  livenessProbe:
    httpGet:
      path: /api/v1/health
      port: 3000
    initialDelaySeconds: 15
    periodSeconds: 10
  readinessProbe:
    httpGet:
      path: /api/v1/health
      port: 3000
    initialDelaySeconds: 5
    periodSeconds: 5

frontend:
  image: ghcr.io/cnd-final/config-man-frontend
  tag: latest
  replicas: 2
  port: 80
  service:
    type: NodePort
    nodePort: 30080

postgresCluster:
  name: config-man-postgres
  numberOfInstances: 2
  volume:
    size: 1Gi
  version: "16"
  username: configman
  database: config_man

pdb:
  backend:
    minAvailable: 2
  frontend:
    minAvailable: 1
