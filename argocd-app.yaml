apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: config-man
  namespace: argocd
  annotations:
    argocd-image-updater.argoproj.io/image-list: backend=ghcr.io/cnd-final/config-man-backend,frontend=ghcr.io/cnd-final/config-man-frontend
    argocd-image-updater.argoproj.io/backend.update-strategy: digest
    argocd-image-updater.argoproj.io/frontend.update-strategy: digest
spec:
  project: default
  source:
    repoURL: https://github.com/CND-final/config-helm
    targetRevision: main
    path: .
    helm:
      releaseName: config-man
  destination:
    server: https://kubernetes.default.svc
    namespace: config-man
  syncPolicy:
    automated:
      prune: true
      selfHeal: true